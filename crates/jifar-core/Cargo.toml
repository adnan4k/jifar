[package]
name = "jifar-core"
description = "Domain types and orchestration for Jifar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jifar-audio.workspace = true
jifar-providers.workspace = true
jifar-store.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.154"
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["rt", "time"] }
tracing.workspace = true
uuid = { version = "1.29.2", features = ["v7"] }

[lints]
workspace = true

[dev-dependencies]
async-trait = "0.1.92"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
