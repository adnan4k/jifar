[package]
name = "jifar-providers"
description = "ASR and notes provider traits and implementations for Jifar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
keyring = "4"
reqwest = { version = "0.13", features = ["json", "multipart", "query"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.154"
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["time", "fs"] }
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
jifar-audio.workspace = true
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
