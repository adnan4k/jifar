[package]
name = "jifar-audio"
description = "Audio capture, encoding and offline chunking for Jifar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
hound = "3.5"
libpulse-binding = { version = "2.30", optional = true }
libpulse-simple-binding = { version = "2.29", optional = true }
ogg = "0.9"
opus = "0.4"
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-17"] }
pipewire = { version = "0.10", optional = true }
rtrb = "0.4"
rubato = "5"
thiserror.workspace = true
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
ctrlc = "3"
tempfile = "3"
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[features]
default = ["pipewire", "pulse"]
# Native PipeWire capture. Needs libpipewire-0.3-dev and clang to build.
# Without it only FakeSource is available (enough for the pipeline tests).
pipewire = ["dep:pipewire"]
# PulseAudio capture for systems without PipeWire audio (stock Ubuntu 22.04).
# Needs libpulse-dev to build.
pulse = ["dep:libpulse-binding", "dep:libpulse-simple-binding"]

