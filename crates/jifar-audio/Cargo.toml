[package]
name = "jifar-audio"
description = "Audio capture, encoding and offline chunking for Jifar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
hound = "3.5"
ogg = "0.9"
opus = "0.4"
pipewire = { version = "0.10", optional = true }
rtrb = "0.4"
thiserror.workspace = true
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
ctrlc = "3"
tempfile = "3"
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[features]
default = ["pipewire"]
# Native PipeWire capture. Needs libpipewire-0.3-dev and clang to build.
# Without it only FakeSource is available (enough for the pipeline tests).
pipewire = ["dep:pipewire"]

[[example]]
name = "record"
required-features = ["pipewire"]
